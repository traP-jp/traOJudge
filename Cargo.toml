[workspace]
members = ["server/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
traojudge-backend_app = { path = "server/traojudge-backend_app" }
traojudge-core = { path = "server/traojudge-core" }
traojudge-infra = { path = "server/traojudge-infra" }
traojudge-test = { path = "server/traojudge-test" }
