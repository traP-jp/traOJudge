[workspace]
members = ["server/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22.1"
chrono = "0.4.39"
fancy-regex = "0.14.0"
jsonwebtoken = "9.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3.8", default-features = false, features = ["base64", "std", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
traojudge-backend_app = { path = "server/traojudge-backend_app" }
traojudge-core = { path = "server/traojudge-core" }
traojudge-infra = { path = "server/traojudge-infra" }
traojudge-test = { path = "server/traojudge-test" }
uuid = { version = "1", features = ["serde", "v4"] }
