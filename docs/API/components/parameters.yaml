Limit:
  name: 'limit'
  in: 'query'
  description: '1ページの取得件数。'
  schema:
    type: 'integer'
    minimum: 1
    maximum: 100
    default: 30
Cursor:
  name: 'cursor'
  in: 'query'
  description: '前ページのnextCursor。任意の内部IDへ読み替えない。'
  schema:
    $ref: '../schemas/common.yaml#/PageCursor'
ProblemSearchQuery:
  name: 'query'
  in: 'query'
  description: '問題タイトルに対する部分一致検索。'
  schema:
    type: 'string'
    minLength: 1
    maxLength: 200
ProblemCreatedByUserId:
  name: 'createdByUserId'
  in: 'query'
  description: '問題の作成者で絞り込む。指定しても閲覧者の権限確認は省略せず、閲覧できない問題は返さない。該当する問題がなければ空のページを返す。'
  schema:
    $ref: '../schemas/common.yaml#/ResourceId'
WebOrigin:
  name: 'Origin'
  in: 'header'
  required: true
  description: 'ブラウザが自動で付ける要求元のOrigin。配置設定で許可したWebUIのscheme・host・portと完全一致する場合だけ変更操作を受け付ける。未指定・null・不一致は403。'
  schema:
    type: 'string'
    format: 'uri'
IdempotencyKey:
  name: 'Idempotency-Key'
  in: 'header'
  required: true
  description: '本人・HTTPメソッド・パスごとに同じ操作の再送を識別する不透明なキー。同じキー・同じ入力は同じ結果、異なる入力は409。保存期間は配置設定で定める。'
  schema:
    type: 'string'
    minLength: 1
    maxLength: 128
    pattern: '^[A-Za-z0-9._:-]+$'
IfMatch:
  name: 'If-Match'
  in: 'header'
  required: true
  description: '取得時のETagを引用符ごと渡す。古い版は412、未指定は428。*による無条件更新は受け付けない。'
  schema:
    type: 'string'
    minLength: 3
    pattern: '^"[^"]+"$'
