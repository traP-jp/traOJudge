              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cannot revoke OAuth account because no other authentication method is available
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid token or request
        "500":
