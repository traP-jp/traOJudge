        type: string
    userIdInQuery:
      name: userId
      in: query
      description: ユーザーID
      schema:
        type: string
    userIdInPath:
      name: userId
      in: path
      description: ユーザーID
      required: true
      schema:
        type: string
    devTokenIdInPath:
