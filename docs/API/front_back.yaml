        - isPublic
        - difficulty
        - statement
        - timeLimit
        - memoryLimit
        - solvedCount
        - testcases
        - createdAt
        - updatedAt
    ProblemSummary:
      title: ProblemSummary
      type: object
      description: 問題の要約
      properties:
        id:
          type: string
          description: 問題ID
        title:
          type: string
          description: 問題タイトル
        authorId:
          type: string
          description: 作問者のユーザーID
        isPublic:
