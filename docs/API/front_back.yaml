      title: PostProblemUpdateRequest
      type: object
      description: 問題更新リクエスト
      properties:
        emptyDirectories:
          type: array
          description: 更新時に新たに作成する空ディレクトリのパス一覧
          items:
            type: object
            properties:
              name:
                type: string
                description: リソース名
            required:
              - name
        runtimeTexts:
          type: array
          description: 更新時に新たに作成するランタイムテキストファイル一覧
          items:
            type: object
            properties:
              name:
                type: string
                description: リソース名
              label:
                type: string
                description: ラベル
            required:
              - name
              - label
        texts:
          type: array
          description: 更新時に新たに作成するテキストファイル一覧
          items:
            type: object
            properties:
              name:
                type: string
                description: リソース名
              hash:
                type: string
                description: ファイルのハッシュ値(SHA256)
            required:
              - name
              - hash
        executions:
          type: array
          description: 更新時に新たに作成する実行ファイル一覧
          items:
            type: object
            properties:
              name:
                type: string
                description: リソース名
              scriptName:
                type: string
                description: スクリプト名
              dependencies:
                type: array
                items:
                  type: object
                  properties:
                    refTo:
                      type: string
                      description: 依存先リソース名
                    pathEnvVar:
                      type: string
                      description: パス環境変数
                  required:
                    - refTo
                    - pathEnvVar
              timeReservedMs:
                type: integer
                description: 実行時間予約(ms)
            required:
              - name
              - hash
              - scriptName
              - dependencies
              - timeReservedMs
        scripts:
          type: array
          description: 更新時に新たに作成するスクリプトファイル一覧
          items:
            type: object
            properties:
              name:
                type: string
                description: リソース名
              hash:
                type: string
                description: ファイルのハッシュ値(SHA256)
            required:
              - name
              - hash
      required:
        - emptyDirectories
        - runtimeTexts
        - texts
        - executions
        - scripts
