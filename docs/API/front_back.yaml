openapi: '3.1.1'
jsonSchemaDialect: 'https://spec.openapis.org/oas/3.1/dialect/base'
info:
  title: 'traOJudge API'
  version: '0.2.0'
  description: |-
    利用者のシナリオとrole.mdを基に書き直した外部HTTP契約案。
    WebはセッションCookie、CLI専用経路は本人の開発者トークンで認証する。
    内部のDAGノード通信は含めない。x-authorizationがpendingの操作は合意まで有効化しない。
    公開APIを持つことと、全エンドポイントが匿名で操作できることは異なる。
  license:
    name: 'MIT'
    identifier: 'MIT'
servers:
  - url: '/api/v1'
    description: '実際のホストはWebUI/CLIの設定で指定する。'
tags:
  - name: 'authentication'
    description: 'メール・外部サービスによる本人確認とセッション。'
  - name: 'me'
    description: '本人のプロフィール・認証手段・開発者トークン。'
  - name: 'permissions'
    description: '役割と対象を固定した付与・剥奪。'
  - name: 'problems'
    description: '問題、テストケース、採点方法。'
  - name: 'problem-files'
    description: 'Webの作問ファイル直接転送。'
  - name: 'submissions'
    description: '提出の受付、再採点、実行ごとの進捗。'
  - name: 'contests'
    description: '通常の大会の作成・出題・参加・一括再採点。'
  - name: 'virtual-contests'
    description: 'バーチャル大会の作成・出題・参加。'
  - name: 'clarifications'
    description: '大会の質問と回答。'
  - name: 'editorials'
    description: '問題の解説と公開範囲。'
  - name: 'cli'
    description: '開発者トークンで認証する問題登録専用API。'
security:
  - sessionCookie: []
paths:
  '/auth/providers':
    $ref: './paths/authentication.yaml#/authProviders'
  '/auth/email/registrations':
    $ref: './paths/authentication.yaml#/authEmailRegistrations'
  '/auth/email/registrations/complete':
    $ref: './paths/authentication.yaml#/authEmailRegistrationsComplete'
  '/auth/email/sessions':
    $ref: './paths/authentication.yaml#/authEmailSessions'
  '/auth/email/sessions/complete':
    $ref: './paths/authentication.yaml#/authEmailSessionsComplete'
  '/auth/session':
    $ref: './paths/authentication.yaml#/authSession'
  '/auth/external/registrations':
    $ref: './paths/authentication.yaml#/authExternalRegistrations'
  '/auth/external/registrations/{authorizationId}/complete':
    $ref: './paths/authentication.yaml#/authExternalRegistrationsByAuthorizationIdComplete'
  '/auth/external/sessions':
    $ref: './paths/authentication.yaml#/authExternalSessions'
  '/auth/external/sessions/{authorizationId}/complete':
    $ref: './paths/authentication.yaml#/authExternalSessionsByAuthorizationIdComplete'
  '/me':
    $ref: './paths/me.yaml#/me'
  '/me/email-changes':
    $ref: './paths/me.yaml#/meEmailChanges'
  '/me/email-changes/complete':
    $ref: './paths/me.yaml#/meEmailChangesComplete'
  '/me/sign-in-methods':
    $ref: './paths/me.yaml#/meSignInMethods'
  '/me/sign-in-methods/external-authorizations':
    $ref: './paths/me.yaml#/meSignInMethodsExternalAuthorizations'
  '/me/sign-in-methods/external-authorizations/{authorizationId}/complete':
    $ref: './paths/me.yaml#/meSignInMethodsExternalAuthorizationsByAuthorizationIdComplete'
  '/me/sign-in-methods/{signInMethodId}':
    $ref: './paths/me.yaml#/meSignInMethodsBySignInMethodId'
  '/me/developer-tokens':
    $ref: './paths/me.yaml#/meDeveloperTokens'
  '/me/developer-tokens/{developerTokenId}':
    $ref: './paths/me.yaml#/meDeveloperTokensByDeveloperTokenId'
  '/me/roles':
    $ref: './paths/me.yaml#/meRoles'
  '/users/{userId}/roles/writer':
    $ref: './paths/permissions.yaml#/usersByUserIdRolesWriter'
  '/problems/{problemId}/owners/{userId}':
    $ref: './paths/permissions.yaml#/problemsByProblemIdOwnersByUserId'
  '/problems/{problemId}/testers/{userId}':
    $ref: './paths/permissions.yaml#/problemsByProblemIdTestersByUserId'
  '/contests/{contestId}/admins/{userId}':
    $ref: './paths/permissions.yaml#/contestsByContestIdAdminsByUserId'
  '/contests/{contestId}/setters/{userId}':
    $ref: './paths/permissions.yaml#/contestsByContestIdSettersByUserId'
  '/virtual-contests/{virtualContestId}/setters/{userId}':
    $ref: './paths/permissions.yaml#/virtualContestsByVirtualContestIdSettersByUserId'
  '/users/{userId}/roles/standard-user':
    $ref: './paths/permissions.yaml#/usersByUserIdRolesStandardUser'
  '/editorials/{editorialId}/authors/{userId}':
    $ref: './paths/permissions.yaml#/editorialsByEditorialIdAuthorsByUserId'
  '/contests/{contestId}/participants/{userId}':
    $ref: './paths/permissions.yaml#/contestsByContestIdParticipantsByUserId'
  '/virtual-contests/{virtualContestId}/participants/{userId}':
    $ref: './paths/permissions.yaml#/virtualContestsByVirtualContestIdParticipantsByUserId'
  '/problems':
    $ref: './paths/problems.yaml#/problems'
  '/me/problems':
    $ref: './paths/problems.yaml#/meProblems'
  '/problems/{problemId}':
    $ref: './paths/problems.yaml#/problemsByProblemId'
  '/problems/{problemId}/publication':
    $ref: './paths/problems.yaml#/problemsByProblemIdPublication'
  '/problems/{problemId}/judge-definitions':
    $ref: './paths/problems.yaml#/problemsByProblemIdJudgeDefinitions'
  '/problems/{problemId}/judge-definitions/{judgeDefinitionId}':
    $ref: './paths/problems.yaml#/problemsByProblemIdJudgeDefinitionsByJudgeDefinitionId'
  '/problems/{problemId}/testcases':
    $ref: './paths/problems.yaml#/problemsByProblemIdTestcases'
  '/problems/{problemId}/testcases/{testcaseId}':
    $ref: './paths/problems.yaml#/problemsByProblemIdTestcasesByTestcaseId'
  '/problems/{problemId}/file-uploads':
    $ref: './paths/problem-files.yaml#/problemsByProblemIdFileUploads'
  '/problems/{problemId}/file-uploads/{uploadId}/complete':
    $ref: './paths/problem-files.yaml#/problemsByProblemIdFileUploadsByUploadIdComplete'
  '/languages':
    $ref: './paths/problems.yaml#/languages'
  '/submission-uploads':
    $ref: './paths/submissions.yaml#/submissionUploads'
  '/submissions':
    $ref: './paths/submissions.yaml#/submissions'
  '/me/submissions':
    $ref: './paths/submissions.yaml#/meSubmissions'
  '/submissions/{submissionId}':
    $ref: './paths/submissions.yaml#/submissionsBySubmissionId'
  '/submissions/{submissionId}/judge-runs':
    $ref: './paths/submissions.yaml#/submissionsBySubmissionIdJudgeRuns'
  '/submissions/{submissionId}/judge-runs/{judgeRunId}':
    $ref: './paths/submissions.yaml#/submissionsBySubmissionIdJudgeRunsByJudgeRunId'
  '/submissions/{submissionId}/rejudges':
    $ref: './paths/submissions.yaml#/submissionsBySubmissionIdRejudges'
  '/problems/{problemId}/rejudge-batches':
    $ref: './paths/submissions.yaml#/problemsByProblemIdRejudgeBatches'
  '/rejudge-batches/{batchId}':
    $ref: './paths/submissions.yaml#/rejudgeBatchesByBatchId'
  '/cli/problems/{problemId}/registrations':
    $ref: './paths/cli.yaml#/cliProblemsByProblemIdRegistrations'
  '/cli/problems/{problemId}/registrations/{registrationId}':
    $ref: './paths/cli.yaml#/cliProblemsByProblemIdRegistrationsByRegistrationId'
  '/cli/problems/{problemId}/registrations/{registrationId}/complete':
    $ref: './paths/cli.yaml#/cliProblemsByProblemIdRegistrationsByRegistrationIdComplete'
  '/contests':
    $ref: './paths/contests.yaml#/contests'
  '/contests/{contestId}':
    $ref: './paths/contests.yaml#/contestsByContestId'
  '/contests/{contestId}/problems':
    $ref: './paths/contests.yaml#/contestsByContestIdProblems'
  '/contests/{contestId}/problems/{problemId}':
    $ref: './paths/contests.yaml#/contestsByContestIdProblemsByProblemId'
  '/contests/{contestId}/participation':
    $ref: './paths/contests.yaml#/contestsByContestIdParticipation'
  '/contests/{contestId}/submissions':
    $ref: './paths/contests.yaml#/contestsByContestIdSubmissions'
  '/contests/{contestId}/standings':
    $ref: './paths/contests.yaml#/contestsByContestIdStandings'
  '/contests/{contestId}/clarifications':
    $ref: './paths/clarifications.yaml#/contestsByContestIdClarifications'
  '/contests/{contestId}/clarifications/{clarificationId}/answer':
    $ref: './paths/clarifications.yaml#/contestsByContestIdClarificationsByClarificationIdAnswer'
  '/contests/{contestId}/rejudge-batches':
    $ref: './paths/contests.yaml#/contestsByContestIdRejudgeBatches'
  '/virtual-contests':
    $ref: './paths/virtual-contests.yaml#/virtualContests'
  '/virtual-contests/{virtualContestId}':
    $ref: './paths/virtual-contests.yaml#/virtualContestsByVirtualContestId'
  '/virtual-contests/{virtualContestId}/problems':
    $ref: './paths/virtual-contests.yaml#/virtualContestsByVirtualContestIdProblems'
  '/virtual-contests/{virtualContestId}/problems/{problemId}':
    $ref: './paths/virtual-contests.yaml#/virtualContestsByVirtualContestIdProblemsByProblemId'
  '/virtual-contests/{virtualContestId}/participation':
    $ref: './paths/virtual-contests.yaml#/virtualContestsByVirtualContestIdParticipation'
  '/virtual-contests/{virtualContestId}/submissions':
    $ref: './paths/virtual-contests.yaml#/virtualContestsByVirtualContestIdSubmissions'
  '/virtual-contests/{virtualContestId}/standings':
    $ref: './paths/virtual-contests.yaml#/virtualContestsByVirtualContestIdStandings'
  '/virtual-contests/{virtualContestId}/clarifications':
    $ref: './paths/clarifications.yaml#/virtualContestsByVirtualContestIdClarifications'
  '/virtual-contests/{virtualContestId}/clarifications/{clarificationId}/answer':
    $ref: './paths/clarifications.yaml#/virtualContestsByVirtualContestIdClarificationsByClarificationIdAnswer'
  '/editorials':
    $ref: './paths/editorials.yaml#/editorials'
  '/problems/{problemId}/editorials':
    $ref: './paths/editorials.yaml#/problemsByProblemIdEditorials'
  '/editorials/{editorialId}':
    $ref: './paths/editorials.yaml#/editorialsByEditorialId'
  '/editorials/{editorialId}/publication':
