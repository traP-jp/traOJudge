  '/contests/{contestId}/clarifications/{clarificationId}':
    $ref: './paths/clarifications.yaml#/contestsByContestIdClarificationsByClarificationId'
  '/virtual-contests/{virtualContestId}/clarifications/{clarificationId}':
    $ref: './paths/clarifications.yaml#/virtualContestsByVirtualContestIdClarificationsByClarificationId'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components/security-schemes.yaml#/SessionCookie'
    developerToken:
      $ref: './components/security-schemes.yaml#/DeveloperToken'
x-contract-status: 'draft'
x-requirements:
  - '../requirements/mutation-scenarios.md'
  - '../requirements/permission-operations.md'
  - '../requirements/submission-progress-constraints.md'
