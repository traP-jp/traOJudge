openapi: '3.1.1'
jsonSchemaDialect: 'https://spec.openapis.org/oas/3.1/dialect/base'
info:
  title: 'traOJudge API'
  version: '0.2.0'
  description: |-
    利用者のシナリオとrole.mdを基に書き直した外部HTTP契約案。
    WebはセッションCookie、CLI専用経路は本人の開発者トークンで認証する。
    メール認証は登録の有無によらず同じ受付応答と本人確認メールを返し、メール確認後にログインまたは新規登録へ分岐する。
    WebUIとAPIはHTTPSの同一オリジンで公開し、/api/*はWebUI側のリバースプロキシからAWSのAPIへ転送する。
    プロキシは要求元のOriginを書き換えず、CookieとSet-Cookieを中継する。セッションCookieにはHttpOnly・Secure・SameSite=Laxを指定する。
    有効なセッションCookieを持つWeb API要求は、共通middlewareが認証後にセッションとSet-Cookieをその時点から90日（3か月相当）後まで延長する。継続利用中の固定の最長期間は設けない。ログアウト・失効済みのセッションは延長しない。WebUI起動時などのログイン確認にはGET /meを使う。
    Web向けの変更操作は未認証の登録・ログイン操作も含め、許可したWebUIのOriginとscheme・host・portが完全一致する場合だけ受け付ける。Originの未指定・null・不一致は403。
    GETでは業務状態を変更しない。開発者トークンで認証するCLI専用経路にはOrigin検証を要求しない。
    内部のDAGノード通信は含めない。x-authorizationがpendingの操作は合意まで有効化しない。
    公開APIを持つことと、全エンドポイントが匿名で操作できることは異なる。
  license:
    name: 'MIT'
    identifier: 'MIT'
servers:
  - url: '/api/v1'
    description: 'WebUIは同一オリジンの/api/v1を利用し、リバースプロキシでAWSのAPIへ転送する。CLIの接続先ホストは配置設定で指定する。'
tags:
  - name: 'authentication'
    description: 'メール・外部サービスによる本人確認とセッション。'
  - name: 'me'
    description: '本人のプロフィール・認証手段・開発者トークン。'
  - name: 'users'
    description: '公開プロフィールと、利用者が作成し閲覧者が閲覧できる問題。'
  - name: 'permissions'
    description: '役割と対象を固定した付与・剥奪。'
  - name: 'problems'
    description: '問題、テストケース、採点方法。'
  - name: 'problem-files'
    description: 'Webの作問ファイル直接転送。'
  - name: 'submissions'
    description: '提出の受付、再採点、実行ごとの進捗。'
  - name: 'contests'
    description: '通常の大会の作成・出題・参加・一括再採点。'
  - name: 'virtual-contests'
    description: 'バーチャル大会の作成・出題・参加。'
  - name: 'clarifications'
    description: '通常大会の質問と回答。'
  - name: 'editorials'
    description: '問題の解説と公開範囲。'
  - name: 'cli'
    description: '開発者トークンで認証する問題登録専用API。'
security:
  - sessionCookie: []
