    security: []
    x-authorization:
      status: 'defined'
      subject: '本人確認可能な未認証の利用者'
      target: 'self'
    x-scenarios:
      - 'A6-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/ExternalAuthorizationRequest'
          example:
            provider: 'google'
    responses:
      '201':
        description: '外部サービスで本人確認を続けるためのURLと、有効期限付きの認証操作IDを返す。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/authentication.yaml#/Authorization'
