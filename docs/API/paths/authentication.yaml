authEmailVerifications:
  post:
    operationId: 'verifyEmailAuthentication'
    tags:
      - 'authentication'
    summary: 'メールを確認しログインまたは新規登録へ進む'
    description: '登録・ログイン共通のメール本人確認トークンを検証する。発行から30分間有効で一度だけ使用でき、リンクのGETだけでは消費しない。有効期限と未使用であることを確認してトークンを消費した後にだけ登録の有無を開示する。登録済みならstatus=signed-inと本人のセッションを返しCookieを発行する。未登録ならstatus=registration-requiredと確認済みメールに紐付くregistrationTokenを返し、表示名の入力へ進める。この分岐では利用者やログインセッション、セッションCookieは作らない。登録用トークンは元の有効期限を引き継ぐ。期限切れ・不正・使用済みのトークンでは登録の有無を開示せず、セッションも登録用トークンも発行しない。'
    security: []
    x-authorization:
      status: 'defined'
      subject: '本人確認可能な未認証の利用者'
      target: 'self'
    x-scenarios:
      - 'A1-02'
      - 'A2-02'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/TokenConfirmation'
          example:
            token: 'email_token_example'
    responses:
      '200':
        description: 'メール確認済み。statusによりログイン完了または新規登録へ分岐する。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/authentication.yaml#/EmailVerificationResult'
            examples:
              signedIn:
                value:
                  status: 'signed-in'
                  session:
                    userId: 'user_example_1'
                    expiresAt: '2027-01-16T13:05:00Z'
              registrationRequired:
                value:
                  status: 'registration-required'
                  registrationToken: 'registration_token_example'
                  expiresAt: '2026-10-18T13:30:00Z'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: 'status=signed-inの場合だけHttpOnly・Secure・SameSite=LaxのセッションCookieを発行する。status=registration-requiredの場合はセッションCookieを発行しない。Cookieはプロキシ経由でWebUIの公開ホストへ返す。発行時のCookieのMax-Ageは7776000（90日）とし、以降のアクセスで期限を延長する。Domain・Pathは配置時に具体化する。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
authSession:
  delete:
    operationId: 'deleteSession'
    tags:
      - 'authentication'
    summary: '現在のセッションを終了する'
    description: '要求のセッションCookieで特定される本人の現在のセッションだけを失効し、同じDomain・PathのCookieを削除する。同じセッションCookieを共有するタブもログアウト済みになる。ほかの端末や別のブラウザのセッションは維持し、開発者トークンや役割は変更しない。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'A2-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '操作が完了した。'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '現在のセッションを失効し、同じDomain・PathでMax-Age=0のセッションCookieを返して削除する。Cookieはプロキシ経由でWebUIの公開ホストへ返す。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
