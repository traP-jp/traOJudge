    x-authorization:
      status: 'defined'
      subject: '本人確認可能な未認証の利用者'
      target: 'self'
    x-scenarios:
      - 'A5-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/ExternalRegistrationCompletion'
          example:
            code: 'provider_code_example'
            state: 'state_example'
            displayName: 'Alice'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
