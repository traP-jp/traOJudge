  post:
    operationId: 'completeExternalRegistration'
    tags:
      - 'authentication'
    summary: '外部アカウントで利用登録を完了する'
    description: '認可コードをproviderで検証し、開始時のstate・目的・ブラウザとの対応を確認して一度だけ消費する。providerとprovider内の安定したアカウントIDを本人の識別子とし、入力された表示名で利用者とstandard-userを作る。同時に本人のセッションを作成し、セッションCookieを発行してログイン済みにする。メールアドレスは登録要件にせず、一致だけで別の利用者を統合しない。同じ外部identityが登録済みなら利用者を作らず409を返し、外部アカウントでログインする流れへ案内する。'
