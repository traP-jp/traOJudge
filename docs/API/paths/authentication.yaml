authEmailRegistrations:
  post:
    operationId: 'requestEmailRegistration'
    tags:
      - 'authentication'
    summary: 'メールで利用登録を申し込む'
    description: 'メールアドレスだけを受け取り、登録・ログイン共通の本人確認メールの配送を依頼する。登録の有無によらず同じ202とrequestId・acceptedAtを返し、応答本文・ヘッダー・メール本文・リンク形式で登録の有無を示さない。利用者やログインセッションはまだ作らない。メール本人確認トークンは発行から30分間有効で、一度だけ使用できる。リンクを開いた後にPOST /auth/email/verificationsで確認し、初めてログインまたは新規登録へ分岐する。再送要求もこの操作を使う。'
    security: []
    x-authorization:
      status: 'defined'
      subject: '本人確認可能な未認証の利用者'
      target: 'self'
    x-scenarios:
      - 'A1-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/EmailRegistrationRequest'
          example:
            email: 'alice@example.com'
    responses:
      '202':
        description: '登録の有無によらず同じ本人確認メールの送信依頼を受け付けた。配送完了・登録完了・ログイン完了を意味しない。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Accepted'
            example:
              requestId: 'req_example_1'
              acceptedAt: '2026-10-18T13:00:00Z'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
authEmailRegistrationsComplete:
  post:
    operationId: 'completeEmailRegistration'
    tags:
      - 'authentication'
    summary: 'メールを確認し利用登録を完了する'
    description: 'メール確認APIでstatus=registration-requiredを受け取った本人が、registrationTokenと表示名を送る。確認済みメールへの紐付け、登録目的、有効期限、未使用であることと表示名を検証し、登録用トークンを一度だけ消費して利用者とstandard-userを作る。同時に本人のセッションとCookieを発行してログイン済みにする。有効期限は元のメール本人確認トークン発行から30分を引き継ぐ。登録用トークンの発行後に登録済みとなった場合は409とし、既存の利用者の情報を上書きしたり新しい利用者を重複作成したりしない。'
    security: []
    x-authorization:
      status: 'defined'
      subject: '本人確認可能な未認証の利用者'
      target: 'self'
    x-scenarios:
      - 'A1-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/EmailRegistrationCompletion'
          example:
            registrationToken: 'registration_token_example'
            displayName: 'Alice'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/authentication.yaml#/RegistrationResult'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '登録した本人のセッションCookieをHttpOnly・Secure・SameSite=Laxで発行する。Cookieはプロキシ経由でWebUIの公開ホストへ返す。発行時のCookieのMax-Ageは7776000（90日）とし、以降のアクセスで期限を延長する。Domain・Pathは配置時に具体化する。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
