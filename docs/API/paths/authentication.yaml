            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
authExternalSessionsByAuthorizationIdComplete:
  parameters:
    - $ref: '../components/parameters.yaml#/AuthorizationId'
  post:
    operationId: 'completeExternalSession'
    tags:
      - 'authentication'
    summary: '外部アカウントでログインを完了する'
    description: '認可コードをproviderで検証し、開始時のstate・目的・ブラウザとの対応を確認して一度だけ消費する。providerとprovider内の安定したアカウントIDで既存のログイン方法を検索する。対応する利用者がいる場合だけその利用者のセッションを作成する。メールアドレスの一致だけで利用者を特定したり、ログイン方法を追加したりしない。対応するログイン方法がなければcode=external_identity_not_registeredの404を返し、新規利用者やセッションは作らずA5の外部アカウント登録へ案内する。'
    security: []
    x-authorization:
      status: 'defined'
      subject: '本人確認可能な未認証の利用者'
      target: 'self'
    x-scenarios:
      - 'A6-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/AuthorizationCompletion'
          example:
            code: 'provider_code_example_2'
            state: 'state_example_2'
    responses:
      '200':
        description: '外部アカウントに対応する既存利用者としてログインした。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/authentication.yaml#/Session'
            example:
              userId: 'user_example_1'
              expiresAt: '2027-01-17T13:05:00Z'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: 'HttpOnly・Secure・SameSite=LaxのセッションCookieを発行する。Cookieはプロキシ経由でWebUIの公開ホストへ返す。発行時のCookieのMax-Ageは7776000（90日）とし、以降のアクセスで期限を延長する。Domain・Pathは配置時に具体化する。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
