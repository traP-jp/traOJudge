contestsByContestIdClarifications:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
  get:
    operationId: 'listContestClarifications'
    tags:
      - 'clarifications'
    summary: '通常の大会の質問と回答を取得する'
    description: '参加者は自分が投稿した質問、運営担当は対象大会の質問を取得できる契約案。他の参加者への公開は未決なので全員へ自動公開しない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - subject: 'question-author'
          scope: 'contestId'
        - role: 'contest-setter'
          scope: 'contestId'
    x-scenarios: []
    parameters:
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Cursor'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Clarifications'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  post:
    operationId: 'createContestClarification'
    tags:
      - 'clarifications'
    summary: '通常の大会に本人が質問する'
    description: '対象大会の参加者本人の質問として記録する。指定した問題があれば対象大会の問題か確認する。質問可能な期間はMUT-06で具体化する。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'contestant'
          scope: 'contestId'
    x-scenarios:
      - 'C3-01'
    parameters:
      - $ref: '../components/parameters.yaml#/CsrfToken'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/ClarificationCreate'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Clarification'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestIdClarificationsByClarificationIdAnswer:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
    - $ref: '../components/parameters.yaml#/ClarificationId'
  put:
    operationId: 'answerContestClarification'
    tags:
      - 'clarifications'
    summary: '通常の大会の質問に運営担当が回答する'
    description: 'この大会の質問にだけ回答する。初回回答を保存し、同じ内容の再送は同じ結果を返す。既存回答の訂正や一般公開を追加の許可なく行わない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'contest-setter'
          scope: 'contestId'
    x-scenarios:
      - 'C3-02'
    parameters:
      - $ref: '../components/parameters.yaml#/CsrfToken'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/ClarificationAnswer'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Clarification'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '428':
        $ref: '../components/responses.yaml#/PreconditionRequired'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
