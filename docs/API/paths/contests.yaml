      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/submissions.yaml#/Submissions'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestIdStandings:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
  get:
    operationId: 'getContestStandings'
    tags:
      - 'contests'
    summary: '通常の個人戦の順位を取得する'
    description: '個人戦の順位を返す。各問題の本人の最高得点の合計で集計し、同得点時は設定されたタイブレークを使う。採点結果の確定と順位への反映には時間差があり得るためupdatedAtを返す。チーム戦では /standings/team を使う。公開時点・非公開大会の閲覧条件はMUT-06で具体化する。'
