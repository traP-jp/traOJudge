contests:
  get:
    operationId: 'listContests'
    tags:
      - 'contests'
    summary: '公開された通常の大会を取得する'
    description: '公開された通常の大会を取得する'
    security: []
    x-authorization:
      status: 'defined'
      subject: 'anyone'
      target: 'public-resources'
    x-scenarios: []
    parameters:
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Cursor'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Contests'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  post:
    operationId: 'createContest'
    tags:
      - 'contests'
    summary: '通常の大会を作る'
    description: 'participationModeで個人戦またはチーム戦を選ぶ。作成者へのcontest-setterやcontest-adminの自動付与は未決。作成と役割の付与を同一と見なさない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'service-admin'
          scope: 'service'
    x-scenarios:
      - 'C1-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/ContestCreate'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Contest'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestId:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
  get:
    operationId: 'getContest'
    tags:
      - 'contests'
    summary: '通常の大会の設定を取得する'
    description: '通常の大会の設定を取得する'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '公開されている'
        - role: 'contest-setter'
          scope: 'contestId'
        - role: 'contest-admin'
          scope: 'contestId'
    x-scenarios: []
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Contest'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  patch:
    operationId: 'updateContest'
    tags:
      - 'contests'
    summary: '通常の大会の概要・時間・ルール・参加方式を変更する'
    description: '対象大会の運営担当だけが概要・時間・ルール・参加方式を変更できる。概要はMarkdown形式で、HTMLは許可しない。開始終了時刻の前後関係を検証し、タイブレーク方式・ペナルティ・参加方式は開始時刻（更新前のstartsAt）以降に変更できない。開始時刻より前に参加方式を個人戦とチーム戦の間で変更すると、この大会の既存の参加登録と大会内チームをすべて削除する。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'contest-setter'
          scope: 'contestId'
    x-scenarios:
      - 'C1-02'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/ContestUpdate'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Contest'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: '参加方式を大会開始後に変更しようとした、または要求が既存状態と競合した。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '428':
        $ref: '../components/responses.yaml#/PreconditionRequired'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'deleteContest'
    tags:
      - 'contests'
    summary: '通常の大会を取り下げる'
    description: '大会を論理削除し、過去の出題・参加・提出・得点の記録を残す。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'service-admin'
          scope: 'service'
    x-scenarios:
      - 'C1-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '操作が完了した。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestIdProblems:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
  get:
    operationId: 'listContestProblems'
    tags:
      - 'contests'
    summary: '通常の大会の出題一覧を取得する'
    description: '対象大会の閲覧・公開範囲に従う。非公開問題の本文・テスト内容をこの操作から開示しない。'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '公開された大会・公開してよい出題情報'
        - role: 'contest-setter'
          scope: 'contestId'
        - role: 'contestant'
          scope: 'contestId'
    x-scenarios: []
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/ContestProblems'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestIdProblemsByProblemId:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
    - $ref: '../components/parameters.yaml#/ProblemId'
  put:
    operationId: 'addContestProblem'
    tags:
      - 'contests'
    summary: '通常の大会に問題を追加する'
    description: '同じ問題が同じ設定で既に含まれていれば同じ結果を返す。既存設定の変更や出題順の再編集は、追加の許可から暗黙に認めない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'contest-setter'
          scope: 'contestId'
          condition: '自身の問題である。「自身」の判定はMUT-09で具体化する'
    x-scenarios:
      - 'C2-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/ContestProblemInput'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/ContestProblem'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'removeContestProblem'
    tags:
      - 'contests'
    summary: '通常の大会から問題を外す'
    description: '大会と問題の結び付きだけを外す。通常の大会では他の作問者の問題も外せる。元の問題そのものを削除する操作ではない。既に外れていれば204。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'contest-setter'
          scope: 'contestId'
    x-scenarios:
      - 'C2-02'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '操作が完了した。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestIdParticipation:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
  post:
    operationId: 'joinContest'
    tags:
      - 'contests'
    summary: '通常の大会へ本人が参加する'
    description: '個人戦の大会で、ログインしている本人だけを参加者にする。他の利用者のuserIdは受け取らない。チーム戦ではこの操作を使わず、チームへの参加操作を使う。管理者が他の人へ参加資格を付ける操作とは分ける。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
          condition: '対象の通常大会が個人戦で公開され、本人が参加条件を満たす'
    x-scenarios:
      - 'R3-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Participation'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: '対象大会がチーム戦のため個人参加として登録できない、または同じキーの要求・既存の参加状態と競合した。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'leaveContestTeam'
    tags:
      - 'contests'
    summary: '通常の大会のチームから抜ける'
    description: 'チーム戦で、ログイン中の本人を現在所属しているチームから外し、大会への参加状態を解消する。大会の現在の開始時刻より前だけ実行できる。開始時刻以降はチーム所属を固定する。対象大会がチーム戦で、本人がチームに所属していない場合は成功扱いとし、すでに抜けた後の再要求も同じ結果にする。個人戦の参加登録を取り消す用途には使わない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
          condition: '対象の通常大会がチーム戦で、本人自身のチーム参加を取り消す'
    x-scenarios:
      - 'R3-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '参加状態を解消した。すでにチームに所属していない場合も成功。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: '対象大会が個人戦、または大会の開始時刻以降にチームを抜けようとした。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestIdTeams:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
  post:
    operationId: 'createOrJoinContestTeam'
    tags:
      - 'contests'
    summary: '通常の大会でチームを作るか、既存チームに参加する'
    description: 'チーム戦の公開大会で、ログイン中の本人がチーム名とパスワードを送る。同じ大会内にその組み合わせがなければチームを作成して本人を所属させ、既にあれば本人をそのチームに所属させる。チーム名とパスワードの組み合わせは大会ごとに一意とする。同じ本人が同じ大会で所属できるチームは1つまで。チームへの新規参加・別チームへの切り替えは大会の現在の開始時刻より前だけ行える。開始時刻以降はチーム所属を固定する。同じチームへの再要求は現在の所属を返す。この作成・参加・切り替え処理は原子的に行い、開始後の要求などが拒否された場合は新しいチームも作成しない。メンバー名はチーム情報として返す。パスワードは応答に含めない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
          condition: '対象の通常大会がチーム戦で公開され、開始前のチーム参加・切り替えであり、本人が参加条件を満たす'
    x-scenarios:
      - 'R3-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/ContestTeamJoinRequest'
    responses:
      '200':
        description: '該当するチームへ本人を所属させた。本人がすでに同じチームに所属している場合も現在の結果を返す。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/ContestTeamParticipation'
      '201':
        description: '該当するチームがなかったため、チームを作成して本人を所属させた。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/ContestTeamParticipation'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: '対象大会が個人戦、開始時刻以降の新規参加・別チームへの切り替え、または同じIdempotency-Keyを異なる入力で再利用した。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
contestsByContestIdTeamsByTeamId:
  parameters:
    - $ref: '../components/parameters.yaml#/ContestId'
    - $ref: '../components/parameters.yaml#/TeamId'
  get:
    operationId: 'getContestTeam'
    tags:
