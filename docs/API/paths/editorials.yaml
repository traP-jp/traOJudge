editorials:
  post:
    operationId: 'createEditorial'
    tags:
      - 'editorials'
    summary: '問題に解説を投稿する'
    description: '解説を投稿する。解答の提出やwriterは必須にしない。暫定仕様として非公開で作成し、投稿者に対象解説のeditiorial-authorを同じトランザクションで付与する。Idempotency-Keyは本人と作成操作ごとに識別し、保存期間内の同じキー・同じ入力には作成時の表現を返す。問題の存在・削除状態・閲覧権限も同じUoWで検査する。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
    x-scenarios:
      - 'O1-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/editorials.yaml#/EditorialCreate'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/editorials.yaml#/Editorial'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
problemsByProblemIdEditorials:
  parameters:
    - $ref: '../components/parameters.yaml#/ProblemId'
  get:
    operationId: 'listProblemEditorials'
    tags:
      - 'editorials'
    summary: '問題の公開解説を取得する'
    description: '閲覧できる問題の一般公開された解説のみを返す。非公開解説を編集できることとは別の閲覧経路。存在しない・削除済み・閲覧できない問題は404。'
    security: []
    x-authorization:
      status: 'defined'
      subject: 'anyone'
      target: 'public-resources'
    x-scenarios: []
    parameters:
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Cursor'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/editorials.yaml#/Editorials'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
editorialsByEditorialId:
  parameters:
    - $ref: '../components/parameters.yaml#/EditorialId'
  get:
    operationId: 'getEditorial'
    tags:
      - 'editorials'
    summary: '公開または本人が編集を担当する解説を取得する'
    description: '公開または本人が編集を担当する解説を取得する'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '公開されている'
        - role: 'editiorial-author'
          scope: 'editorialId'
    x-scenarios: []
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/editorials.yaml#/Editorial'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  patch:
    operationId: 'updateEditorial'
    tags:
      - 'editorials'
    summary: '担当する解説を編集する'
    description: '担当する解説を編集する'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'editiorial-author'
          scope: 'editorialId'
    x-scenarios:
      - 'O1-02'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/editorials.yaml#/EditorialUpdate'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/editorials.yaml#/Editorial'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '428':
        $ref: '../components/responses.yaml#/PreconditionRequired'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'deleteEditorial'
    tags:
      - 'editorials'
    summary: '解説を取り下げる'
    description: '投稿者本人またはservice-adminが解説を論理削除する。編集担当であることだけでは許可しない。削除後は取得・一覧・編集の対象外となり、作成要求の再送でも復活しない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '対象解説の投稿者本人'
        - role: 'service-admin'
          scope: 'service'
    x-scenarios:
      - 'O1-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '操作が完了した。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
editorialsByEditorialIdPublication:
  parameters:
    - $ref: '../components/parameters.yaml#/EditorialId'
  put:
    operationId: 'publishEditorial'
    tags:
      - 'editorials'
    summary: '解説を公開する'
    description: '投稿者本人またはservice-adminが解説を公開する。編集担当であることだけでは許可しない。If-Matchの検査と公開状態の変更は同じUoWで行う。'
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '対象解説の投稿者本人'
        - role: 'service-admin'
          scope: 'service'
    x-scenarios:
      - 'R2-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IfMatch'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/permissions.yaml#/Visibility'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
      '428':
        $ref: '../components/responses.yaml#/PreconditionRequired'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'unpublishEditorial'
    tags:
      - 'editorials'
    summary: '解説を非公開にする'
    description: '投稿者本人またはservice-adminが解説を非公開にする。編集担当であることだけでは許可しない。既に非公開でも204を返す。'
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '対象解説の投稿者本人'
        - role: 'service-admin'
          scope: 'service'
    x-scenarios:
      - 'R2-04'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '操作が完了した。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
