meDeveloperTokensByDeveloperTokenId:
  parameters:
    - $ref: '../components/parameters.yaml#/DeveloperTokenId'
  delete:
    operationId: 'revokeDeveloperToken'
    tags:
      - 'me'
    summary: '本人の作問ツール用トークンを失効する'
    description: '本人の作問ツール用トークンを直ちに失効し、それ以降の新しいCLI API要求では使用できなくする。失効前に発行済みのファイルアップロードURLは、それぞれのexpiresAtまで有効なままにする。すでに受け付けた問題登録は、登録開始時に発行した登録専用の継続トークンで登録のexpiresAtまで状態確認と完了を続行できる。完了時には現在の変更権限を確認する。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'A4-02'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '開発者トークンを失効した。失効後に開始するCLI API要求は認証されない。発行済みのファイルアップロードURLはそれぞれのexpiresAtまで使える。すでに受け付けた登録は専用の継続トークンを使い、その登録のexpiresAtまで状態確認と完了を続けられる。完了時には現在の変更権限を確認する。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
meRoles:
  get:
    operationId: 'listMyRoles'
    tags:
      - 'me'
    summary: '本人の役割と対象範囲を取得する'
    description: '本人の役割と対象範囲を取得する'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'R1'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/permissions.yaml#/RoleAssignments'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
