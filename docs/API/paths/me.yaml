me:
  get:
    operationId: 'getMe'
    tags:
      - 'me'
    summary: '本人の情報と役割を取得する'
    description: 'ログイン中の本人の情報と役割を返す。WebUIは起動時や画面の再表示時にこの応答でログイン状態を確認する。セッションがない・失効済みなら401を返す。有効なセッションの期限とCookieは共通認証middlewareが延長する。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'O2'
      - 'A2'
      - 'A6'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/users.yaml#/CurrentUser'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '有効なセッションのCookieを同じDomain・PathでHttpOnly・Secure・SameSite=Lax・Max-Age=7776000（90日）として更新する。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  patch:
    operationId: 'updateMe'
    tags:
      - 'me'
    summary: '本人のプロフィールを変更する'
    description: '本人のプロフィールを変更する。githubId・atcoderId・xIdは本人が申告するユーザー名で、外部サービスとの認証・連携には使わない。変更項目を省略すると維持し、空文字を指定すると未設定にする。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'O2-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/users.yaml#/ProfileUpdate'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/users.yaml#/CurrentUser'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '428':
        $ref: '../components/responses.yaml#/PreconditionRequired'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
meEmailChanges:
  post:
    operationId: 'requestEmailChange'
    tags:
      - 'me'
    summary: '新しいメールアドレスの確認を依頼する'
    description: 'ログインしている本人の新しいメールアドレスへの変更依頼を受け付ける。変更先がほかの利用者の登録済みメールアドレスの場合は、確認メールを送信せず、確認用トークンも発行しない。それ以外の場合は確認リンクの配送を依頼し、新しい確認用トークンを発行した時点で同じ本人の以前の未使用のメール変更トークンを失効させる。登録状況と送信の有無によらず、同じ202とrequestId・acceptedAtを返し、応答本文・ヘッダーで登録の有無を示さない。登録済みであることを理由に409は返さない。メールを送信しない場合もメールアドレスと既存のセッションは変更せず、新しいトークンを発行せず、既存のトークンも失効させない。確認用トークンは開始した利用者・新しいメールアドレス・メール変更目的に紐付け、発行から30分間有効で、一度だけ使用できる。リンクを開くGETでは消費せず、POST /me/email-changes/completeで変更を完了するときに消費する。確認が完了するまでは以前のメールアドレスを変更しない。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'A3-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/EmailChangeRequest'
    responses:
      '202':
        description: '登録状況と送信の有無によらず同じ受付応答を返す。メール送信や変更完了を保証しない。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Accepted'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
meEmailChangesComplete:
  post:
    operationId: 'completeEmailChange'
    tags:
      - 'me'
    summary: '確認済みのメールアドレスへ変更する'
    description: '開始した本人のログイン状態と確認用トークンを検証して登録先を切り替える。トークンが開始した利用者・新しいメールアドレス・メール変更目的に紐付き、発行から30分未満で未使用である場合だけ受け付け、変更完了と同時に一度だけ消費する。新しいメール変更トークンを発行した時点で以前の未使用トークンは失効し、失効前に発行されたリンクは使用できない。メールアドレスの切り替えと同時に、この完了要求のセッションCookieで特定される現在のセッションを除き、本人の既存のセッションをサーバー側で失効する。維持するセッションはクライアントに指定させない。現在のセッションと同じCookieを共有するタブはログイン状態を維持する。現在のセッションは通常のWebAPIアクセスと同様に有効期限をその時点から90日後まで延長し、Cookieも更新する。ほかのセッションでは再ログインが必要となり、失効したCookieを送る後続の認証必須APIは401とする。リンクを開いても確認用トークンの有効期限を延長しない。不正・期限切れ・使用済み・再送後に失効したトークンではメールアドレスを変更せず、変更不成立を理由にセッションを失効させない。再送要求はPOST /me/email-changesを使う。ほかの利用者の認証手段を移動しない。以前のメールアドレスへの変更完了通知は送らない。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'A3-02'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/TokenConfirmation'
    responses:
      '204':
        description: 'メールアドレスの変更と、現在のセッション以外の本人の既存のセッションの失効が完了した。現在のログイン状態は維持し、応答本文は返さない。'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証状態の変更結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '現在のセッションのtraojudge_sessionを、発行時と同じDomain・PathでHttpOnly・Secure・SameSite=Lax・Max-Age=7776000（90日）として更新する。Cookieはプロキシ経由でWebUIの公開ホストへ返す。ほかのセッションのCookieはサーバー側の失効により利用できない。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        description: '確認用トークンが不正・期限切れ・使用済み、または新しい変更依頼で失効済み。メールアドレスとセッションは変更しない。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
meSignInMethods:
