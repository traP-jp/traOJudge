            schema:
              type: 'string'
            description: '有効なセッションのCookieを同じDomain・PathでHttpOnly・Secure・SameSite=Lax・Max-Age=7776000（90日）として更新する。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
