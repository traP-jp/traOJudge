meSignInMethodsExternalAuthorizations:
  post:
    operationId: 'startSignInMethodAuthorization'
    tags:
      - 'me'
    summary: 'ログイン方法の追加を開始する'
    description: '現在の有効なセッションで認証済みの本人に、外部ログイン方法の追加を開始する。追加する外部アカウントでの本人確認を要求するが、本人の現在のログイン方法による再認証は要求しない。開始時のログイン中の利用者・provider・目的・ブラウザ・有効期限を対応付ける。1人の利用者には同じproviderの方法を1つまで登録できる。すでに登録済みなら外部認証へ進まず409を返す。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'A7-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/ExternalAuthorizationRequest'
          example:
            provider: 'google'
    responses:
      '201':
        description: '外部サービスで本人確認を続けるためのURLと、有効期限付きの認証操作IDを返す。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/authentication.yaml#/Authorization'
            example:
              authorizationId: 'ca1ed093-fc24-51c6-be78-d2f608941072'
              authorizationUrl: 'https://provider.example/authorize?client_id=app_example&state=state_example_3'
              expiresAt: '2026-10-19T13:30:00Z'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '有効なセッションのCookieを同じDomain・PathでHttpOnly・Secure・SameSite=Lax・Max-Age=7776000（90日）として更新する。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        description: '同じproviderのログイン方法が本人に登録済み。別アカウントの追加には、先に既存の方法を外す必要がある。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
meSignInMethodsExternalAuthorizationsByAuthorizationIdComplete:
  parameters:
    - $ref: '../components/parameters.yaml#/AuthorizationId'
  post:
    operationId: 'completeSignInMethodAuthorization'
    tags:
      - 'me'
    summary: '確認した外部アカウントを本人へ追加する'
    description: '現在の有効なセッションで認証済みの本人が、開始時と同じ利用者であること、および認可目的・provider・state・ブラウザとの対応を検証する。追加する外部アカウントの本人確認は行うが、現在の利用者への追加の再認証は要求しない。1人の利用者には同じproviderの方法を1つまで登録できる。同じ本人に同じ外部identityが追加済みなら重複作成せず既存のログイン方法を返す。同じproviderの別アカウントが追加済み、または外部identityが他の利用者に結び付いている場合は409で拒否する。登録済みの方法を置き換えず、認証方法の追加で役割も増やさない。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'A7-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/authentication.yaml#/AuthorizationCompletion'
          example:
            code: 'provider_code_example_3'
            state: 'state_example_3'
    responses:
      '200':
        description: '指定した外部identityは本人に追加済み。重複行を作らず、既存のログイン方法を返す。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/authentication.yaml#/SignInMethod'
            example:
              id: '47e16edb-e89b-5504-a455-be6de7e60367'
              kind: 'google'
              createdAt: '2026-10-19T13:05:00Z'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '有効なセッションのCookieを同じDomain・PathでHttpOnly・Secure・SameSite=Lax・Max-Age=7776000（90日）として更新する。'
      '201':
        description: '本人のアカウントに外部ログイン方法を追加した。利用者ID・権限・既存の記録は変更しない。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/authentication.yaml#/SignInMethod'
            example:
              id: '47e16edb-e89b-5504-a455-be6de7e60367'
              kind: 'google'
              createdAt: '2026-10-19T13:05:00Z'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '有効なセッションのCookieを同じDomain・PathでHttpOnly・Secure・SameSite=Lax・Max-Age=7776000（90日）として更新する。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: '同じproviderの別アカウントが本人に登録済み、またはこの外部identityが別の利用者に結び付いている。既存の方法は変更しない。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
meSignInMethodsBySignInMethodId:
  parameters:
    - $ref: '../components/parameters.yaml#/SignInMethodId'
  delete:
    operationId: 'removeSignInMethod'
    tags:
      - 'me'
    summary: '本人のログイン方法を外す'
    description: '本人に属するtraQ・Google・GitHubの外部ログイン方法だけを外す。メールなど外部ログイン方法以外や本人に属さないIDは404とする。別のWebログイン方法が残らず最後の方法になる場合は409を返す。外部サービスごとに本人へ登録できる方法は1つまで。削除しても現在や他端末ですでに発行済みのセッションは失効させず、外した方法による以降の新規ログインだけを拒否する。CLIの開発者トークンはWebログイン方法として数えない。'
    x-authorization:
      status: 'defined'
      subject: 'authenticated-user'
      target: 'self'
    x-scenarios:
      - 'A8-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '本人の外部ログイン方法を外した。応答本文は返さず、他のログイン方法・発行済みセッション・利用者の記録・役割は変更しない。'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証状態の変更結果をキャッシュしない。'
          Set-Cookie:
            schema:
              type: 'string'
            description: '有効なセッションのCookieを同じDomain・PathでHttpOnly・Secure・SameSite=Lax・Max-Age=7776000（90日）として更新する。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: '対象を外すと本人のWebログイン方法がなくなるため、変更しない。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
