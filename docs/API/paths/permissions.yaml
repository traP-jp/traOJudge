usersByUserIdRolesWriter:
  parameters:
    - $ref: '../components/parameters.yaml#/UserId'
  put:
    operationId: 'grantWriter'
    tags:
      - 'permissions'
    summary: 'writerを指定した人へ付与する'
    description: '対象はuserIdで指定した登録済み利用者、サービス全体。他の対象へ許可を広げない。既に割り当て済みならchanged=falseで同じ割り当てを返す。service-adminという役割自体の付与は扱わない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'service-admin'
          scope: 'service'
    x-scenarios:
      - 'R1-01-G'
    parameters:
      - $ref: '../components/parameters.yaml#/CsrfToken'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/permissions.yaml#/RoleChangeResult'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'revokeWriter'
    tags:
      - 'permissions'
    summary: 'writerを指定した人から剥奪する'
    description: '指定した利用者・役割・対象範囲だけを外す。既に外れていれば204。他の役割による許可まで削除しない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'service-admin'
          scope: 'service'
    x-scenarios:
      - 'R1-01-D'
    parameters:
      - $ref: '../components/parameters.yaml#/CsrfToken'
    responses:
      '204':
        description: '操作が完了した。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
