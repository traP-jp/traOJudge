    operationId: 'getProblem'
    tags:
      - 'problems'
    summary: '問題を取得する'
    description: '公開問題は未ログインでも取得できる。非公開問題の閲覧はその問題のproblem-owner / tester、またはその問題を含む通常大会のcontest-setterに限る。大会参加者への非公開問題の開示条件は別途未決。'
