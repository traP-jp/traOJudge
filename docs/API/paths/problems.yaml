problems:
  get:
    operationId: 'listProblems'
    tags:
      - 'problems'
    summary: '公開問題の一覧を取得する'
    description: '一般公開された問題だけを返す。非公開の作業対象はGET /me/problemsで取得する。'
    security: []
    x-authorization:
      status: 'defined'
      subject: 'anyone'
      target: 'public-resources'
    x-scenarios: []
    parameters:
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Cursor'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/problems.yaml#/Problems'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  post:
    operationId: 'createProblem'
    tags:
      - 'problems'
    summary: '非公開の問題を作成する'
    description: 'writerが新しい非公開問題を作る。createdByUserIdにはログイン中の本人を記録する。作成者へのproblem-ownerの自動付与は未決であり、作成者の記録だけで編集権限が付与されたとは扱わない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'writer'
          scope: 'service'
    x-scenarios:
      - 'P1-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/problems.yaml#/ProblemCreate'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/problems.yaml#/Problem'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
