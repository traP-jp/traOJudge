submissionUploads:
  post:
    operationId: 'createSubmissionUpload'
    tags:
      - 'submissions'
    summary: '提出ソースの転送先を発行する'
    description: '問題・言語・提出先の文脈・本人に結び付けた転送先を発行する。ソース本体はS3へ直接転送する。この操作では提出はまだ確定しない。通常大会のチーム戦ではteamIdを要求せず、ログイン中の本人の所属チームをサーバー側で特定する。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
          condition: '公開問題へのpractice提出'
        - role: 'contestant'
          scope: 'context.contestId'
          condition: '対象大会の問題かつ開催時間中。チーム戦では本人が所属するチームをサーバー側で特定する'
        - role: 'virtual-contestant'
          scope: 'context.virtualContestId'
          condition: '対象大会の問題かつ開催時間中'
    x-scenarios:
      - 'S1-01'
      - 'S1-02'
      - 'S1-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/submissions.yaml#/SourceUploadRequest'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/submissions.yaml#/SourceUpload'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
submissions:
  post:
    operationId: 'createSubmission'
    tags:
      - 'submissions'
    summary: '転送済みソースから提出を確定する'
    description: 'uploadIdに保存した本人・問題・言語・文脈・ファイルを検証し、現在の認可・提出期間も再検査する。採用版と今回の実行IDを固定して提出を受理する。通常大会のチーム戦ではteamIdを要求せず、受理時点の本人の所属チームを記録し、その提出をチームの得点集計に含める。提出者本人のuserIdも記録する。同じuploadIdで異なる提出を重複作成しない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
          condition: '公開問題へのpractice提出'
        - role: 'contestant'
          scope: 'context.contestId'
          condition: '対象大会の問題かつ開催時間中。チーム戦では本人が所属するチームの得点として受理する'
        - role: 'virtual-contestant'
          scope: 'context.virtualContestId'
          condition: '対象大会の問題かつ開催時間中'
    x-scenarios:
      - 'S1-01'
      - 'S1-02'
      - 'S1-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/submissions.yaml#/SubmissionCreate'
    responses:
      '202':
        description: '依頼を受け付けた。処理の完了とは別。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/submissions.yaml#/SubmissionAccepted'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
          Location:
            schema:
              type: 'string'
              format: 'uri-reference'
            description: '作成した提出の相対URL。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
