submissionsBySubmissionId:
  parameters:
    - $ref: '../components/parameters.yaml#/SubmissionId'
  get:
    operationId: 'getSubmission'
    tags:
      - 'submissions'
    summary: '提出の受付内容と現在の採点の識別子を取得する'
    description: '提出者本人、その提出先の大会の運営担当、または通常大会のチーム戦で同じチームに所属するメンバーに返す。運営担当の閲覧は対象大会の提出に限る。チーム戦では、提出者本人のuserIdと得点集計先のteamIdを返す。提出ソースや非公開テストはこの応答に含めない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - subject: 'submission-owner'
          scope: 'submissionId'
        - role: 'contestant'
          scope: 'submission.teamId'
          condition: '通常大会のチーム戦で、閲覧者が提出のteamIdと同じチームに所属する'
        - role: 'contest-setter'
          scope: 'submission.contestId'
        - role: 'virtual-contest-setter'
          scope: 'submission.virtualContestId'
    x-scenarios:
      - 'S4'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/submissions.yaml#/Submission'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
submissionsBySubmissionIdSource:
  parameters:
    - $ref: '../components/parameters.yaml#/SubmissionId'
  get:
    operationId: 'getSubmissionSource'
    tags:
      - 'submissions'
    summary: '提出ソースのダウンロード先を発行する'
    description: 'ソース本体はS3から直接取得する。提出者本人はいつでも、通常大会のチーム戦では同じチームのメンバーも取得できる。提出が通常大会またはバーチャル大会に紐づく場合、その大会のendsAt到達後はログインの有無を問わず誰でも取得できる。非公開問題への提出でも、大会に紐づく提出なら同じ公開条件を適用する。'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - subject: 'submission-owner'
          scope: 'submissionId'
        - role: 'contestant'
          scope: 'submission.teamId'
          condition: '通常大会のチーム戦で、閲覧者が提出のteamIdと同じチームに所属する'
        - condition: '提出が通常大会またはバーチャル大会に紐づき、その大会のendsAtに到達している。ログイン不要'
    x-scenarios:
      - 'S1'
    responses:
      '200':
        description: '提出に含まれるファイルごとの署名付きダウンロードURL。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/submissions.yaml#/SubmissionSourceDownload'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '署名付きURLをキャッシュしない。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
