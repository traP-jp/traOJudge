  get:
    operationId: 'getJudgeRun'
    tags:
      - 'submissions'
    summary: '今回の採点の進捗と確定結果を取得する'
    description: '完了したテストケース数を、最終結果を待たずに取得できる。ケースの不正解・時間切れも完了に数え、残りをすべて実行する。同じrun内のrevisionで新旧を判断し、再接続時もこの最新状態から復帰できる。提出者本人、運営担当、または通常大会のチーム戦で同じチームに所属するメンバーが取得できる。ケースの名前・入出力・各判定は含めない。HTTPでの最新状態取得を先に定義し、更新の通知手段や間隔はMUT-10で決める。'
    x-authorization:
      status: 'defined'
      anyOf:
        - subject: 'submission-owner'
          scope: 'submissionId'
        - role: 'contestant'
          scope: 'submission.teamId'
          condition: '通常大会のチーム戦で、閲覧者が提出のteamIdと同じチームに所属する'
        - role: 'contest-setter'
          scope: 'submission.contestId'
        - role: 'virtual-contest-setter'
          scope: 'submission.virtualContestId'
    x-scenarios:
