usersByUserId:
  parameters:
    - $ref: '../components/parameters.yaml#/UserId'
  get:
    operationId: 'getUserProfile'
    tags:
      - 'users'
    summary: '利用者の公開プロフィールを取得する'
    description: '指定した利用者の公開プロフィールを返す。本人が申告したgithubId・atcoderId・xIdを含む。これらは外部サービスとの認証・連携を示さない。メールアドレスや役割などの非公開情報は含めない。'
    security: []
    x-authorization:
      status: 'defined'
      subject: 'anyone'
      target: 'public-resources'
    x-scenarios:
      - 'O3'
    responses:
      '200':
        description: '利用者の公開プロフィール。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/users.yaml#/Profile'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
