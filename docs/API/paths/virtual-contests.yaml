virtualContests:
  get:
    operationId: 'listVirtualContests'
    tags:
      - 'virtual-contests'
    summary: '公開されたバーチャル大会を取得する'
    description: '公開されたバーチャル大会を取得する'
    security: []
    x-authorization:
      status: 'defined'
      subject: 'anyone'
      target: 'public-resources'
    x-scenarios: []
    parameters:
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Cursor'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/VirtualContests'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  post:
    operationId: 'createVirtualContest'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会を作る'
    description: '作成者に対象大会のvirtual-contest-setterを同じトランザクションで自動付与する。参加者全員が大会共通の開始・終了時刻を使い、個人別開始・再挑戦は設けない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
    x-scenarios:
      - 'C1-04'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/VirtualContestCreate'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/VirtualContest'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
virtualContestsByVirtualContestId:
  parameters:
    - $ref: '../components/parameters.yaml#/VirtualContestId'
  get:
    operationId: 'getVirtualContest'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会の設定を取得する'
    description: 'バーチャル大会の設定を取得する'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '公開されている'
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
    x-scenarios: []
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/VirtualContest'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  patch:
    operationId: 'updateVirtualContest'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会の題名・公開範囲・時間・ルールを変更する'
    description: '対象大会のvirtual-contest-setterが設定を変更する。更新前の開始時刻以降は題名・公開範囲・開始時刻・ルールを固定し、終了時刻だけを変更できる。題名・公開範囲の変更では既存の参加資格を削除しない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
    x-scenarios:
      - 'C1-05'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/VirtualContestUpdate'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/VirtualContest'
        headers:
          ETag:
            description: 'このリソースの強いETag。更新時のIf-Matchへ引用符を含めて渡す。'
            schema:
              type: 'string'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '428':
        $ref: '../components/responses.yaml#/PreconditionRequired'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'deleteVirtualContest'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会を取り下げる'
    description: '対象大会のvirtual-contest-setterが論理削除する。過去の出題・参加の記録を保持する。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
    x-scenarios:
      - 'C1-06'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '操作が完了した。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
virtualContestsByVirtualContestIdProblems:
  parameters:
    - $ref: '../components/parameters.yaml#/VirtualContestId'
  get:
    operationId: 'listVirtualContestProblems'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会の出題一覧を取得する'
    description: '開始前は対象大会のvirtual-contest-setterだけが取得できる。開始後は公開大会なら誰でも、非公開大会なら運営担当・参加者が取得できる。問題本文・テスト内容は開示しない。'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '開始時刻以降の公開大会の出題情報'
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
        - role: 'virtual-contestant'
          scope: 'virtualContestId'
          condition: '開始時刻以降'
    x-scenarios: []
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/ContestProblems'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
virtualContestsByVirtualContestIdProblemsByProblemId:
  parameters:
    - $ref: '../components/parameters.yaml#/VirtualContestId'
    - $ref: '../components/parameters.yaml#/ProblemId'
  put:
    operationId: 'addVirtualContestProblem'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会に問題を追加する'
    description: '同じ問題が同じ設定で既に含まれていれば同じ結果を返す。既存設定の変更や出題順の再編集は、追加の許可から暗黙に認めない。追加・取り外しは大会の終了時刻より前まで可能。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
          condition: '問題が公開されている'
    x-scenarios:
      - 'C2-03'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    requestBody:
      required: true
      content:
        'application/json':
          schema:
            $ref: '../schemas/contests.yaml#/ContestProblemInput'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/ContestProblem'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
  delete:
    operationId: 'removeVirtualContestProblem'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会から問題を外す'
    description: '対象大会のvirtual-contest-setterが大会と問題の関連付けだけを外す。終了時刻より前まで可能。既に外れていれば204。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
    x-scenarios:
      - 'C2-04'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
    responses:
      '204':
        description: '操作が完了した。'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
virtualContestsByVirtualContestIdParticipation:
  parameters:
    - $ref: '../components/parameters.yaml#/VirtualContestId'
  post:
    operationId: 'joinVirtualContest'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会へ本人が参加する'
    description: '公開大会へログイン中の本人を参加登録する。standard-userが終了時刻より前まで新規参加でき、開催中も受け付ける。登録済みの本人の再要求は現在の参加状態を返す。他人のuserIdは受け取らない。'
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'standard-user'
          scope: 'service'
          condition: '対象大会が公開され、終了時刻より前の本人の参加'
    x-scenarios:
      - 'R4-01'
    parameters:
      - $ref: '../components/parameters.yaml#/WebOrigin'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '201':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Participation'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
virtualContestsByVirtualContestIdSubmissions:
  parameters:
    - $ref: '../components/parameters.yaml#/VirtualContestId'
  get:
    operationId: 'listVirtualContestSubmissions'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会に紐づく提出を取得する'
    description: 'この大会に対する提出だけを返す。大会外の提出や、別の大会の提出は含めない。運営担当は開催中も取得でき、終了時刻の到達後はログインの有無を問わず誰でも取得できる。非公開問題への提出も、この大会に紐づくものは終了後の一覧に含める。'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
        - condition: '対象大会のendsAtに到達している。ログイン不要'
    x-scenarios: []
    parameters:
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Cursor'
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/submissions.yaml#/Submissions'
        headers:
          Cache-Control:
            schema:
              type: 'string'
              const: 'no-store'
            description: '認証情報・署名付きURL・途中結果をキャッシュしない。'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
virtualContestsByVirtualContestIdStandings:
  parameters:
    - $ref: '../components/parameters.yaml#/VirtualContestId'
  get:
    operationId: 'getVirtualContestStandings'
    tags:
      - 'virtual-contests'
    summary: 'バーチャル大会の順位を取得する'
    description: '公開範囲と開催ルールに従う。各問題の提出の最高得点の合計で集計し、同得点時は設定されたタイブレークを使う。採点結果の確定と順位への反映には時間差があり得るためupdatedAtを返す。公開時点・非公開大会の閲覧条件はMUT-06で具体化する。'
    security:
      - {}
      - sessionCookie: []
    x-authorization:
      status: 'defined'
      anyOf:
        - condition: '公開されている順位表'
        - role: 'virtual-contest-setter'
          scope: 'virtualContestId'
        - role: 'virtual-contestant'
          scope: 'virtualContestId'
    x-scenarios: []
    responses:
      '200':
        description: '操作結果。'
        content:
          'application/json':
            schema:
              $ref: '../schemas/contests.yaml#/Standings'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      default:
        $ref: '../components/responses.yaml#/UnexpectedError'
