    - 'endsAt'
    - 'rules'
    - 'revision'
VirtualContests:
  type: 'object'
  additionalProperties: false
  properties:
    items:
      type: 'array'
      items:
        $ref: './contests.yaml#/VirtualContest'
    nextCursor:
      anyOf:
        - type: 'string'
        - type: 'null'
  required:
    - 'items'
    - 'nextCursor'
ClarificationCreate:
  type: 'object'
  additionalProperties: false
  properties:
    body:
      type: 'string'
      minLength: 1
      maxLength: 10000
    problemId:
      $ref: './common.yaml#/ResourceId'
  required:
    - 'body'
ClarificationAnswer:
  type: 'object'
  additionalProperties: false
  properties:
    body:
      type: 'string'
      minLength: 1
      maxLength: 10000
  required:
    - 'body'
Clarification:
  type: 'object'
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/ResourceId'
    authorId:
      $ref: './common.yaml#/ResourceId'
    body:
      type: 'string'
    problemId:
      anyOf:
        - $ref: './common.yaml#/ResourceId'
        - type: 'null'
    answer:
      anyOf:
        - type: 'string'
        - type: 'null'
    answeredBy:
      anyOf:
        - $ref: './common.yaml#/ResourceId'
        - type: 'null'
    revision:
      $ref: './common.yaml#/Version'
    createdAt:
      type: 'string'
      format: 'date-time'
  required:
    - 'id'
    - 'authorId'
    - 'body'
    - 'problemId'
    - 'answer'
    - 'answeredBy'
    - 'revision'
    - 'createdAt'
Clarifications:
  type: 'object'
  additionalProperties: false
  properties:
    items:
      type: 'array'
      items:
        $ref: './contests.yaml#/Clarification'
    nextCursor:
      anyOf:
        - type: 'string'
        - type: 'null'
  required:
    - 'items'
    - 'nextCursor'
Standing:
  type: 'object'
  additionalProperties: false
  properties:
    userId:
      $ref: './common.yaml#/ResourceId'
    rank:
      type: 'integer'
      minimum: 1
    score:
      type: 'number'
    tieBreakValue:
      type: 'number'
    updatedAt:
      type: 'string'
      format: 'date-time'
  required:
    - 'userId'
    - 'rank'
    - 'score'
    - 'tieBreakValue'
    - 'updatedAt'
Standings:
  type: 'object'
  additionalProperties: false
  properties:
    items:
      type: 'array'
      items:
        $ref: './contests.yaml#/Standing'
    updatedAt:
      type: 'string'
      format: 'date-time'
  required:
    - 'items'
    - 'updatedAt'
