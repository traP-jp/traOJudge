[package]
name = "traojudge-judge"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "json", "tls-rustls-ring"] }
tokio = { workspace = true, features = ["time", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
traojudge-core.workspace = true
traojudge-workflow.workspace = true
traojudge-infra.workspace = true
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
aws-sdk-secretsmanager = "1"

base64.workspace = true

# AWS 1.12 uses smithy-schema 0.2; aws-types 1.7 changes that public type.
aws-types = "=1.6.0"
workspace-hack.workspace = true
